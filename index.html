<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>動画レーンタイム計測（試作）</title>
<meta name="description" content="動画からレーン別にスタート〜規定周回のタイムを計測する試作ツール" />
<style>
:root {
  --bg: #0d0d0f;
  --panel: #1c1c1e;
  --line: #2c2c2e;
  --text: #f2f2f7;
  --sub: #8e8e93;
  --blue: #6BAFD6;
  --pink: #e891b0;
  --green: #34c759;
  --orange: #ff9f0a;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; min-height: 100%; background: var(--bg); color: var(--text);
  font-family: "游ゴシック", "Yu Gothic", "Hiragino Sans", "Meiryo", sans-serif;
}
.app { max-width: 960px; margin: 0 auto; padding: 12px 12px 32px; }
h1 {
  font-size: 13px; letter-spacing: 0.18em; font-weight: 650;
  color: #9aa3b2; text-align: center; margin: 4px 0 12px;
}
.panel {
  background: var(--panel); border-radius: 10px; padding: 12px;
  margin-bottom: 10px; border: 1px solid rgba(255,255,255,0.06);
}
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; margin-bottom: 8px; }
label { display: flex; flex-direction: column; gap: 4px; font-size: 11px; color: var(--sub); }
input[type="number"], select, input[type="file"] {
  background: #0d0d0f; color: var(--text); border: 1px solid #3a3a3c;
  border-radius: 6px; padding: 8px 10px; font-size: 14px; min-width: 0;
}
input[type="number"] { width: 88px; }
button {
  border: none; border-radius: 8px; padding: 10px 14px; font-size: 13px; font-weight: 700;
  cursor: pointer; color: #fff;
}
.btn-blue { background: var(--blue); color: #0d0d0f; }
.btn-pink { background: var(--pink); color: #1c1c1e; }
.btn-gray { background: #3a3a3c; }
.btn-green { background: var(--green); color: #0d0d0f; }
button:disabled { opacity: 0.4; cursor: default; }
.hint { font-size: 11px; color: var(--sub); line-height: 1.5; margin: 6px 0 0; }
.stage-wrap {
  position: relative; width: 100%; background: #000; border-radius: 8px; overflow: hidden;
  touch-action: none;
}
canvas { display: block; width: 100%; height: auto; vertical-align: top; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.status {
  font-size: 12px; color: var(--sub); min-height: 1.4em; margin-top: 8px;
}
.status strong { color: var(--blue); }
table {
  width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 4px;
}
th, td {
  text-align: left; padding: 8px 6px; border-bottom: 1px solid rgba(255,255,255,0.08);
  font-variant-numeric: tabular-nums;
}
th { color: var(--sub); font-size: 11px; font-weight: 600; }
td.time { font-weight: 700; color: #fff; }
td.done { color: var(--green); }
td.pending { color: var(--orange); }
.lane-colors span {
  display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px;
}
.steps { font-size: 12px; color: var(--sub); line-height: 1.6; margin: 0; padding-left: 1.1em; }
.steps li { margin-bottom: 2px; }
</style>
</head>
<body>
<div class="app">
  <h1>VIDEO LANE TIMER（試作）</h1>

  <div class="panel">
    <ol class="steps">
      <li>動画を選択</li>
      <li>レーン数・周回数を入力</li>
      <li>赤い計測ラインをドラッグで移動</li>
      <li>色付きレーン帯の端をドラッグして幅・位置を調整（右がレーン1）</li>
      <li>「解析」で各レーンのタイム一覧を表示</li>
    </ol>
  </div>

  <div class="panel">
    <div class="row">
      <label>動画
        <input type="file" id="fileInput" accept="video/*" />
      </label>
      <label>レーン数
        <input type="number" id="laneCount" min="1" max="8" value="3" />
      </label>
      <label>周回数
        <input type="number" id="lapCount" min="1" max="50" value="3" />
      </label>
      <label>感度
        <input type="number" id="sensitivity" min="5" max="80" value="22" title="大きいほど鈍感" />
      </label>
      <label>通過の最短間隔(秒)
        <input type="number" id="minGap" min="0.15" max="5" step="0.05" value="0.6" />
      </label>
    </div>
    <p class="hint">
      右から1・2・3…のレーン帯です。通過は「計測ライン上の各レーン帯で映像が大きく変わった瞬間」を数えます。
      1回目の通過＝スタート、（周回数+1）回目＝ゴールです。固定カメラ・はっきりしたライン向きの試作です。
    </p>
  </div>

  <div class="panel">
    <div class="stage-wrap" id="stageWrap">
      <canvas id="cv"></canvas>
    </div>
    <div class="toolbar">
      <button type="button" class="btn-gray" id="btnPlay">再生/一時停止</button>
      <button type="button" class="btn-blue" id="btnAnalyze">解析</button>
      <button type="button" class="btn-gray" id="btnResetHits">検知リセット</button>
    </div>
    <div class="status" id="status">動画を選択してください</div>
  </div>

  <div class="panel">
    <div style="font-size:12px;font-weight:700;margin-bottom:6px;">各レーンのタイム一覧</div>
    <table>
      <thead>
        <tr>
          <th>レーン</th>
          <th>通過回数</th>
          <th>タイム</th>
          <th>状態</th>
        </tr>
      </thead>
      <tbody id="resultBody">
        <tr><td colspan="4" style="color:#8e8e93;">未解析</td></tr>
      </tbody>
    </table>
  </div>
</div>

<video id="vid" playsinline muted style="display:none"></video>

<script>
(function () {
  var LANE_COLORS = ['#6BAFD6', '#e891b0', '#ff9f0a', '#34c759', '#af52de', '#ff3b30', '#64d2ff', '#ffd60a'];

  var vid = document.getElementById('vid');
  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d', { willReadFrequently: true });
  var statusEl = document.getElementById('status');
  var resultBody = document.getElementById('resultBody');

  var state = {
    ready: false,
    // finish line y in video pixel coords (0..videoHeight)
    lineY: 0.55,
    // lanes: array of {x0, x1} in normalized 0..1 from LEFT of video.
    // Display order: rightmost = lane 1
    lanes: [],
    drag: null, // {type, laneIndex, edge}
    hits: [],   // per lane array of times (seconds)
    analyzing: false,
    lastSample: null
  };

  function laneCount() {
    return Math.max(1, Math.min(8, parseInt(document.getElementById('laneCount').value, 10) || 3));
  }
  function lapCount() {
    return Math.max(1, Math.min(50, parseInt(document.getElementById('lapCount').value, 10) || 3));
  }
  function sensitivity() {
    return Math.max(5, Math.min(80, parseFloat(document.getElementById('sensitivity').value) || 22));
  }
  function minGap() {
    return Math.max(0.15, Math.min(5, parseFloat(document.getElementById('minGap').value) || 0.6));
  }

  function initLanes(n) {
    n = n || laneCount();
    state.lanes = [];
    for (var i = 0; i < n; i++) {
      var a = i / n;
      var b = (i + 1) / n;
      // leave small gap
      state.lanes.push({ x0: a + 0.01, x1: b - 0.01 });
    }
    state.hits = state.lanes.map(function () { return []; });
  }

  function setStatus(msg) {
    statusEl.innerHTML = msg;
  }

  function resizeCanvas() {
    if (!vid.videoWidth) return;
    var maxW = cv.parentElement.clientWidth || 640;
    var scale = maxW / vid.videoWidth;
    cv.width = vid.videoWidth;
    cv.height = vid.videoHeight;
    cv.style.width = Math.round(vid.videoWidth * scale) + 'px';
    cv.style.height = Math.round(vid.videoHeight * scale) + 'px';
  }

  function draw() {
    if (!vid.videoWidth) return;
    ctx.drawImage(vid, 0, 0, cv.width, cv.height);

    var h = cv.height;
    var w = cv.width;
    var y = state.lineY * h;

    // lane bands
    state.lanes.forEach(function (ln, i) {
      var x0 = ln.x0 * w;
      var x1 = ln.x1 * w;
      var color = LANE_COLORS[i % LANE_COLORS.length];
      ctx.fillStyle = hexAlpha(color, 0.18);
      ctx.fillRect(x0, 0, Math.max(2, x1 - x0), h);
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.strokeRect(x0 + 1, 1, Math.max(2, x1 - x0 - 2), h - 2);
      // handles
      ctx.fillStyle = color;
      ctx.fillRect(x0 - 3, y - 18, 6, 36);
      ctx.fillRect(x1 - 3, y - 18, 6, 36);
      // label: rightmost visual is lane 1? User said 右から1番目
      // Our lanes array is left-to-right index 0 = leftmost.
      // Display label from right: laneNumber = n - i
      var n = state.lanes.length;
      var laneNo = n - i;
      ctx.font = 'bold 14px sans-serif';
      ctx.fillStyle = color;
      ctx.fillText('L' + laneNo, x0 + 6, 20);
    });

    // finish line
    ctx.strokeStyle = '#ff3b30';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(w, y);
    ctx.stroke();
    ctx.fillStyle = '#ff3b30';
    ctx.fillRect(0, y - 4, w, 8);
    ctx.globalAlpha = 0.35;
    ctx.fillRect(0, y - 4, w, 8);
    ctx.globalAlpha = 1;

    // hit marks
    state.hits.forEach(function (arr, i) {
      var ln = state.lanes[i];
      if (!ln) return;
      var cx = ((ln.x0 + ln.x1) / 2) * w;
      arr.forEach(function (t, hi) {
        ctx.fillStyle = '#fff';
        ctx.font = '11px monospace';
        ctx.fillText((hi === 0 ? 'S ' : '') + t.toFixed(2) + 's', cx - 18, y - 10 - hi * 12);
      });
    });
  }

  function hexAlpha(hex, a) {
    var h = hex.replace('#', '');
    var r = parseInt(h.slice(0, 2), 16);
    var g = parseInt(h.slice(2, 4), 16);
    var b = parseInt(h.slice(4, 6), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
  }

  function pointerToVideo(e) {
    var rect = cv.getBoundingClientRect();
    var clientX = e.clientX != null ? e.clientX : (e.touches && e.touches[0].clientX);
    var clientY = e.clientY != null ? e.clientY : (e.touches && e.touches[0].clientY);
    var x = (clientX - rect.left) / rect.width;
    var y = (clientY - rect.top) / rect.height;
    return {
      x: Math.max(0, Math.min(1, x)),
      y: Math.max(0, Math.min(1, y))
    };
  }

  function hitTest(p) {
    var y = state.lineY;
    // near finish line -> drag line
    if (Math.abs(p.y - y) < 0.04) {
      return { type: 'line' };
    }
    var wSense = 0.025;
    for (var i = 0; i < state.lanes.length; i++) {
      var ln = state.lanes[i];
      if (Math.abs(p.x - ln.x0) < wSense) return { type: 'edge', lane: i, edge: 'x0' };
      if (Math.abs(p.x - ln.x1) < wSense) return { type: 'edge', lane: i, edge: 'x1' };
      if (p.x > ln.x0 && p.x < ln.x1) return { type: 'move', lane: i };
    }
    return null;
  }

  function onDown(e) {
    if (!state.ready) return;
    e.preventDefault();
    var p = pointerToVideo(e);
    state.drag = hitTest(p);
    if (state.drag && state.drag.type === 'move') {
      state.drag.originX = p.x;
      state.drag.orig0 = state.lanes[state.drag.lane].x0;
      state.drag.orig1 = state.lanes[state.drag.lane].x1;
    }
  }
  function onMove(e) {
    if (!state.drag) return;
    e.preventDefault();
    var p = pointerToVideo(e);
    if (state.drag.type === 'line') {
      state.lineY = p.y;
    } else if (state.drag.type === 'edge') {
      var ln = state.lanes[state.drag.lane];
      if (state.drag.edge === 'x0') ln.x0 = Math.min(p.x, ln.x1 - 0.02);
      else ln.x1 = Math.max(p.x, ln.x0 + 0.02);
      ln.x0 = Math.max(0, Math.min(1, ln.x0));
      ln.x1 = Math.max(0, Math.min(1, ln.x1));
    } else if (state.drag.type === 'move') {
      var ln2 = state.lanes[state.drag.lane];
      var dx = p.x - state.drag.originX;
      var w = state.drag.orig1 - state.drag.orig0;
      var nx0 = state.drag.orig0 + dx;
      var nx1 = state.drag.orig1 + dx;
      if (nx0 < 0) { nx0 = 0; nx1 = w; }
      if (nx1 > 1) { nx1 = 1; nx0 = 1 - w; }
      ln2.x0 = nx0; ln2.x1 = nx1;
    }
    draw();
  }
  function onUp() { state.drag = null; }

  cv.addEventListener('mousedown', onDown);
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onUp);
  cv.addEventListener('touchstart', onDown, { passive: false });
  window.addEventListener('touchmove', onMove, { passive: false });
  window.addEventListener('touchend', onUp);

  document.getElementById('fileInput').addEventListener('change', function (e) {
    var f = e.target.files && e.target.files[0];
    if (!f) return;
    var url = URL.createObjectURL(f);
    vid.src = url;
    vid.onloadedmetadata = function () {
      state.ready = true;
      state.lineY = 0.55;
      initLanes(laneCount());
      resizeCanvas();
      vid.currentTime = 0;
      setTimeout(function () { draw(); }, 50);
      setStatus('動画準備完了（' + vid.videoWidth + '×' + vid.videoHeight + ' / ' + vid.duration.toFixed(2) + '秒）。ラインとレーンを調整して解析してください。');
      renderResults();
    };
  });

  document.getElementById('laneCount').addEventListener('change', function () {
    initLanes(laneCount());
    if (state.ready) draw();
    renderResults();
  });

  document.getElementById('btnPlay').addEventListener('click', function () {
    if (!state.ready) return;
    if (vid.paused) {
      vid.play();
      loopPreview();
    } else {
      vid.pause();
    }
  });

  function loopPreview() {
    if (vid.paused || vid.ended) { draw(); return; }
    draw();
    requestAnimationFrame(loopPreview);
  }

  document.getElementById('btnResetHits').addEventListener('click', function () {
    state.hits = state.lanes.map(function () { return []; });
    renderResults();
    draw();
    setStatus('検知をリセットしました');
  });

  function sampleLaneSignature(lane) {
    var w = cv.width, h = cv.height;
    var y = Math.round(state.lineY * h);
    var band = 5; // px above/below line
    var y0 = Math.max(0, y - band);
    var y1 = Math.min(h - 1, y + band);
    var x0 = Math.round(lane.x0 * w);
    var x1 = Math.round(lane.x1 * w);
    if (x1 <= x0) return null;
    var img = ctx.getImageData(x0, y0, x1 - x0, y1 - y0 + 1);
    var d = img.data;
    var step = 4 * 3; // subsample
    var sum = 0, count = 0;
    for (var i = 0; i < d.length; i += step) {
      // luminance
      sum += 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
      count++;
    }
    return count ? sum / count : 0;
  }

  function renderResults() {
    var need = lapCount() + 1; // crossings
    var n = state.lanes.length;
    if (!n) {
      resultBody.innerHTML = '<tr><td colspan="4" style="color:#8e8e93;">未解析</td></tr>';
      return;
    }
    var html = '';
    for (var i = 0; i < n; i++) {
      var laneNo = n - i; // right = 1
      var hits = state.hits[i] || [];
      var color = LANE_COLORS[i % LANE_COLORS.length];
      var timeStr = '—';
      var st = '待ち';
      var cls = 'pending';
      if (hits.length >= need) {
        var t = hits[need - 1] - hits[0];
        timeStr = t.toFixed(3) + ' 秒';
        st = '完了';
        cls = 'done';
      } else if (hits.length > 0) {
        timeStr = (vid.duration ? '計測中' : '—');
        st = hits.length + ' / ' + need + ' 通過';
      }
      html += '<tr>' +
        '<td class="lane-colors"><span style="background:' + color + '"></span>レーン ' + laneNo + '</td>' +
        '<td>' + hits.length + '</td>' +
        '<td class="time ' + cls + '">' + timeStr + '</td>' +
        '<td class="' + cls + '">' + st + '</td></tr>';
    }
    resultBody.innerHTML = html;
  }

  async function analyze() {
    if (!state.ready || state.analyzing) return;
    if (vid.duration && !isFinite(vid.duration)) {
      setStatus('この動画は長さを取得できません');
      return;
    }
    state.analyzing = true;
    state.hits = state.lanes.map(function () { return []; });
    document.getElementById('btnAnalyze').disabled = true;
    vid.pause();

    var duration = vid.duration || 0;
    var fps = 30; // analysis sampling rate
    var step = 1 / fps;
    var baselines = state.lanes.map(function () { return null; });
    var lastHitT = state.lanes.map(function () { return -999; });
    var need = lapCount() + 1;
    var sens = sensitivity();
    var gap = minGap();

    setStatus('解析中… 0%');

    // warm first frame
    vid.currentTime = 0;
    await waitSeek();
    draw();
    state.lanes.forEach(function (ln, i) {
      baselines[i] = sampleLaneSignature(ln);
    });

    for (var t = step; t < duration; t += step) {
      vid.currentTime = t;
      await waitSeek();
      draw();

      state.lanes.forEach(function (ln, i) {
        if (state.hits[i].length >= need) return;
        var sig = sampleLaneSignature(ln);
        if (sig == null || baselines[i] == null) return;
        var diff = Math.abs(sig - baselines[i]);
        // update baseline slowly when calm
        if (diff < sens * 0.35) {
          baselines[i] = baselines[i] * 0.9 + sig * 0.1;
          return;
        }
        if (diff >= sens && (t - lastHitT[i]) >= gap) {
          state.hits[i].push(Number(t.toFixed(3)));
          lastHitT[i] = t;
          // lock new baseline after hit
          baselines[i] = sig;
        }
      });

      if (Math.floor(t * 10) % 5 === 0) {
        var pct = Math.min(99, Math.round((t / duration) * 100));
        setStatus('解析中… <strong>' + pct + '%</strong>');
        renderResults();
        await nextFrame();
      }
    }

    renderResults();
    setStatus('解析完了（周回 ' + lapCount() + ' ／ 必要通過 ' + need + ' 回）');
    state.analyzing = false;
    document.getElementById('btnAnalyze').disabled = false;
    vid.currentTime = 0;
    await waitSeek();
    draw();
  }

  function waitSeek() {
    return new Promise(function (resolve) {
      var done = false;
      var finish = function () {
        if (done) return;
        done = true;
        vid.removeEventListener('seeked', finish);
        resolve();
      };
      vid.addEventListener('seeked', finish);
      // fallback
      setTimeout(finish, 80);
    });
  }
  function nextFrame() {
    return new Promise(function (r) { requestAnimationFrame(function () { r(); }); });
  }

  document.getElementById('btnAnalyze').addEventListener('click', function () {
    analyze().catch(function (e) {
      console.error(e);
      state.analyzing = false;
      document.getElementById('btnAnalyze').disabled = false;
      setStatus('解析エラー: ' + (e && e.message ? e.message : e));
    });
  });

  window.addEventListener('resize', function () {
    if (!state.ready) return;
    resizeCanvas();
    draw();
  });

  initLanes(3);
  renderResults();
})();
</script>
</body>
</html>
