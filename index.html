<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>動画レーンタイム計測</title>
<meta name="description" content="斜め計測ライン対応。動画からレーン別タイムを計測する試作アプリ" />
<style>
:root {
  --bg: #0b0c0f;
  --panel: #16181d;
  --border: rgba(255,255,255,0.08);
  --text: #f3f4f6;
  --muted: #9ca3af;
  --red: #ff3b30;
  --blue: #6BAFD6;
  --pink: #e891b0;
  --green: #34c759;
  --orange: #ff9f0a;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; min-height: 100%; background: var(--bg); color: var(--text);
  font-family: "游ゴシック", "Yu Gothic", "Hiragino Sans", "Meiryo", sans-serif;
}
.app { max-width: 980px; margin: 0 auto; padding: 12px 12px 40px; }
h1 {
  margin: 0 0 10px; text-align: center; font-size: 12px; letter-spacing: 0.22em;
  color: #9aa3b2; font-weight: 650;
}
.card {
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 12px; padding: 12px; margin-bottom: 10px;
}
.card h2 {
  margin: 0 0 8px; font-size: 12px; color: var(--muted);
  letter-spacing: 0.08em; font-weight: 700;
}
.grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
  gap: 8px; align-items: end;
}
label { display: flex; flex-direction: column; gap: 4px; font-size: 11px; color: var(--muted); }
input[type="file"], input[type="number"] {
  width: 100%; border: 1px solid #2a2d34; background: #0b0c0f; color: var(--text);
  border-radius: 8px; padding: 9px 10px; font-size: 14px;
}
.btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
button {
  border: 0; border-radius: 8px; padding: 10px 14px; font-weight: 700; font-size: 13px;
  cursor: pointer; color: #111;
}
.b-red { background: var(--red); color: #fff; }
.b-blue { background: var(--blue); }
.b-gray { background: #3a3a3c; color: #fff; }
.b-green { background: var(--green); }
button:disabled { opacity: 0.4; cursor: default; }
button.active { box-shadow: 0 0 0 2px #fff; }
.hint { margin: 8px 0 0; font-size: 11px; line-height: 1.55; color: var(--muted); }
.stage {
  position: relative; background: #000; border-radius: 10px; overflow: hidden;
  touch-action: none; user-select: none;
}
canvas { display: block; width: 100%; height: auto; }
.status {
  margin-top: 8px; min-height: 1.4em; font-size: 12px; color: var(--muted);
}
.status em { color: var(--blue); font-style: normal; font-weight: 700; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td {
  text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border);
  font-variant-numeric: tabular-nums;
}
th { font-size: 11px; color: var(--muted); font-weight: 600; }
.dot {
  display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px;
}
.ok { color: var(--green); font-weight: 700; }
.wait { color: var(--orange); }
.banner {
  position: absolute; left: 0; right: 0; top: 0; padding: 10px 12px;
  background: rgba(0,0,0,0.55); color: #fff; font-size: 13px; font-weight: 700;
  pointer-events: none;
}
</style>
</head>
<body>
<div class="app">
  <h1>VIDEO LANE TIMER</h1>

  <div class="card">
    <h2>1. 動画と条件</h2>
    <div class="grid">
      <label style="grid-column: 1 / -1;">動画ファイル
        <input type="file" id="file" accept="video/*" />
      </label>
      <label>レーン数
        <input type="number" id="laneN" min="1" max="8" value="3" />
      </label>
      <label>周回数
        <input type="number" id="laps" min="1" max="50" value="3" />
      </label>
      <label>感度（大=鈍感）
        <input type="number" id="sens" min="5" max="80" value="22" />
      </label>
      <label>最短間隔(秒)
        <input type="number" id="gap" min="0.15" max="5" step="0.05" value="0.6" />
      </label>
    </div>
    <p class="hint">
      写真のように、STARTラインに合わせて<strong>赤い計測線を斜めに2点で引きます</strong>。
      レーン帯は線の上に乗り、右端側をレーン1とします。
    </p>
  </div>

  <div class="card">
    <h2>2. ライン配置（始点 → 終点）</h2>
    <div class="btns">
      <button type="button" class="b-red" id="btnLine">赤ラインを引き直す</button>
      <button type="button" class="b-gray" id="btnCancel" style="display:none;">キャンセル</button>
      <button type="button" class="b-gray" id="btnPlay">再生/停止</button>
      <button type="button" class="b-blue" id="btnRun">解析開始</button>
      <button type="button" class="b-gray" id="btnClear">検知リセット</button>
    </div>
    <div class="stage" id="stage">
      <canvas id="cv"></canvas>
      <div class="banner" id="banner" style="display:none;"></div>
    </div>
    <div class="status" id="status">動画を選んでください</div>
  </div>

  <div class="card">
    <h2>3. 各レーンのタイム一覧</h2>
    <table>
      <thead>
        <tr><th>レーン</th><th>通過</th><th>タイム</th><th>状態</th></tr>
      </thead>
      <tbody id="tbody">
        <tr><td colspan="4" style="color:#9ca3af;">未解析</td></tr>
      </tbody>
    </table>
  </div>
</div>

<video id="video" playsinline muted style="display:none"></video>

<script>
/**
 * Video Lane Timer — clean rewrite
 * ---------------------------------
 * Model:
 *  - finishLine: two endpoints in normalized video coords {x,y} 0..1
 *  - lanes: segments along the line parameter t∈[0,1] (t=0 start, t=1 end)
 *  - Lane number: from end side → lane 1 (matches "右から1番" when drawn L→R)
 * Detection:
 *  - Sample luminance along each lane segment near the line
 *  - Crossing when sudden change vs adaptive baseline
 * Timing:
 *  - 1st hit = start, (laps+1)th hit = finish
 *  - time = finish - start
 */
(function () {
  'use strict';

  var COLORS = ['#6BAFD6', '#e891b0', '#ff9f0a', '#34c759', '#af52de', '#ff3b30', '#64d2ff', '#ffd60a'];

  var video = document.getElementById('video');
  var canvas = document.getElementById('cv');
  var ctx = canvas.getContext('2d', { willReadFrequently: true });
  var statusEl = document.getElementById('status');
  var bannerEl = document.getElementById('banner');
  var tbody = document.getElementById('tbody');

  var App = {
    ready: false,
    analyzing: false,
    drawMode: false, // placing line
    placePhase: 0,   // 1=wait start, 2=wait end
    line: { x1: 0.15, y1: 0.62, x2: 0.85, y2: 0.48 },
    lanes: [],       // {t0,t1}
    hits: [],        // seconds[] per lane
    drag: null
  };

  function $(id) { return document.getElementById(id); }
  function num(id, def) {
    var v = parseFloat($(id).value);
    return isFinite(v) ? v : def;
  }
  function laneCount() { return Math.max(1, Math.min(8, Math.round(num('laneN', 3)))); }
  function lapCount() { return Math.max(1, Math.min(50, Math.round(num('laps', 3)))); }
  function sens() { return Math.max(5, Math.min(80, num('sens', 22))); }
  function gapSec() { return Math.max(0.15, Math.min(5, num('gap', 0.6))); }

  function setStatus(html) { statusEl.innerHTML = html; }
  function setBanner(text) {
    if (!text) { bannerEl.style.display = 'none'; return; }
    bannerEl.style.display = 'block';
    bannerEl.textContent = text;
  }

  function resetLanes() {
    var n = laneCount();
    App.lanes = [];
    for (var i = 0; i < n; i++) {
      var a = i / n;
      var b = (i + 1) / n;
      App.lanes.push({ t0: a + 0.012, t1: b - 0.012 });
    }
    App.hits = App.lanes.map(function () { return []; });
  }

  // --- geometry ---
  function lerp(a, b, t) { return a + (b - a) * t; }
  function linePoint(t) {
    return {
      x: lerp(App.line.x1, App.line.x2, t),
      y: lerp(App.line.y1, App.line.y2, t)
    };
  }
  function projectT(p) {
    var dx = App.line.x2 - App.line.x1;
    var dy = App.line.y2 - App.line.y1;
    var len2 = dx * dx + dy * dy || 1e-8;
    var t = ((p.x - App.line.x1) * dx + (p.y - App.line.y1) * dy) / len2;
    return Math.max(0, Math.min(1, t));
  }
  function dist(a, b) {
    var dx = a.x - b.x, dy = a.y - b.y;
    return Math.sqrt(dx * dx + dy * dy);
  }
  function toPx(p) {
    return { x: p.x * canvas.width, y: p.y * canvas.height };
  }
  function pointerNorm(evt) {
    var rect = canvas.getBoundingClientRect();
    var cx = evt.clientX != null ? evt.clientX : evt.touches[0].clientX;
    var cy = evt.clientY != null ? evt.clientY : evt.touches[0].clientY;
    return {
      x: clamp((cx - rect.left) / rect.width, 0, 1),
      y: clamp((cy - rect.top) / rect.height, 0, 1)
    };
  }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

  // --- canvas ---
  function fitCanvas() {
    if (!video.videoWidth) return;
    var maxW = canvas.parentElement.clientWidth || 640;
    var scale = maxW / video.videoWidth;
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.style.width = Math.round(video.videoWidth * scale) + 'px';
    canvas.style.height = Math.round(video.videoHeight * scale) + 'px';
  }

  function draw() {
    if (!video.videoWidth) return;
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

    var p1 = toPx({ x: App.line.x1, y: App.line.y1 });
    var p2 = toPx({ x: App.line.x2, y: App.line.y2 });
    var dx = p2.x - p1.x, dy = p2.y - p1.y;
    var len = Math.sqrt(dx * dx + dy * dy) || 1;
    var nx = -dy / len, ny = dx / len;
    var half = Math.max(16, Math.min(canvas.width, canvas.height) * 0.035);

    // lanes as strips along the red line
    App.lanes.forEach(function (lane, i) {
      var a = toPx(linePoint(lane.t0));
      var b = toPx(linePoint(lane.t1));
      var color = COLORS[i % COLORS.length];
      ctx.beginPath();
      ctx.moveTo(a.x + nx * half, a.y + ny * half);
      ctx.lineTo(b.x + nx * half, b.y + ny * half);
      ctx.lineTo(b.x - nx * half, b.y - ny * half);
      ctx.lineTo(a.x - nx * half, a.y - ny * half);
      ctx.closePath();
      ctx.fillStyle = color;
      ctx.globalAlpha = 0.24;
      ctx.fill();
      ctx.globalAlpha = 1;
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.stroke();

      // handles
      ctx.fillStyle = color;
      circle(a.x, a.y, 6);
      circle(b.x, b.y, 6);

      var mid = toPx(linePoint((lane.t0 + lane.t1) * 0.5));
      var laneNo = App.lanes.length - i; // end side ≈ lane 1 when drawn left→right
      ctx.fillStyle = color;
      ctx.font = 'bold 13px sans-serif';
      ctx.fillText('L' + laneNo, mid.x - 10, mid.y - half - 8);
    });

    // red measurement line (like the photo markup)
    ctx.strokeStyle = 'rgba(255,59,48,0.95)';
    ctx.lineWidth = Math.max(6, Math.min(canvas.width, canvas.height) * 0.012);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(p1.x, p1.y);
    ctx.lineTo(p2.x, p2.y);
    ctx.stroke();

    // endpoints
    ctx.fillStyle = varRed();
    circle(p1.x, p1.y, 11);
    circle(p2.x, p2.y, 11);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 12px sans-serif';
    ctx.fillText('始点', p1.x + 14, p1.y - 12);
    ctx.fillText('終点', p2.x + 14, p2.y - 12);
  }

  function varRed() { return '#ff3b30'; }
  function circle(x, y, r) {
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }

  // --- interaction ---
  function hitTest(p) {
    var a = { x: App.line.x1, y: App.line.y1 };
    var b = { x: App.line.x2, y: App.line.y2 };
    if (dist(p, a) < 0.045) return { type: 'p1' };
    if (dist(p, b) < 0.045) return { type: 'p2' };
    for (var i = 0; i < App.lanes.length; i++) {
      var lane = App.lanes[i];
      if (dist(p, linePoint(lane.t0)) < 0.04) return { type: 'edge', i: i, which: 't0' };
      if (dist(p, linePoint(lane.t1)) < 0.04) return { type: 'edge', i: i, which: 't1' };
      var t = projectT(p);
      if (t >= lane.t0 && t <= lane.t1 && dist(p, linePoint(t)) < 0.05) {
        return { type: 'move', i: i, t: t, t0: lane.t0, t1: lane.t1 };
      }
    }
    return null;
  }

  function onPointerDown(e) {
    if (!App.ready) return;
    e.preventDefault();
    var p = pointerNorm(e);

    if (App.drawMode) {
      if (App.placePhase === 1) {
        App.line.x1 = p.x; App.line.y1 = p.y;
        // temporary end near start
        App.line.x2 = clamp(p.x + 0.05, 0, 1);
        App.line.y2 = p.y;
        App.placePhase = 2;
        setBanner('終点をタップ（コースのラインに合わせて斜めでもOK）');
        setStatus('終点を指定してください');
        draw();
        return;
      }
      if (App.placePhase === 2) {
        App.line.x2 = p.x; App.line.y2 = p.y;
        finishDrawMode();
        return;
      }
    }

    App.drag = hitTest(p);
  }

  function onPointerMove(e) {
    if (!App.drag || App.drawMode) return;
    e.preventDefault();
    var p = pointerNorm(e);
    if (App.drag.type === 'p1') {
      App.line.x1 = p.x; App.line.y1 = p.y;
    } else if (App.drag.type === 'p2') {
      App.line.x2 = p.x; App.line.y2 = p.y;
    } else if (App.drag.type === 'edge') {
      var t = projectT(p);
      var lane = App.lanes[App.drag.i];
      if (App.drag.which === 't0') lane.t0 = Math.min(t, lane.t1 - 0.02);
      else lane.t1 = Math.max(t, lane.t0 + 0.02);
    } else if (App.drag.type === 'move') {
      var t2 = projectT(p);
      var dt = t2 - App.drag.t;
      var w = App.drag.t1 - App.drag.t0;
      var n0 = App.drag.t0 + dt;
      var n1 = App.drag.t1 + dt;
      if (n0 < 0) { n0 = 0; n1 = w; }
      if (n1 > 1) { n1 = 1; n0 = 1 - w; }
      App.lanes[App.drag.i].t0 = n0;
      App.lanes[App.drag.i].t1 = n1;
    }
    draw();
  }

  function onPointerUp() { App.drag = null; }

  function startDrawMode() {
    if (!App.ready) {
      setStatus('先に動画を選択してください');
      return;
    }
    App.drawMode = true;
    App.placePhase = 1;
    App.drag = null;
    $('btnLine').classList.add('active');
    $('btnCancel').style.display = '';
    setBanner('始点をタップ（写真の赤線の一端）');
    setStatus('始点をタップしてください');
    draw();
  }

  function finishDrawMode() {
    App.drawMode = false;
    App.placePhase = 0;
    $('btnLine').classList.remove('active');
    $('btnCancel').style.display = 'none';
    setBanner('');
    resetLanes();
    setStatus('ライン配置完了。レーン帯を調整して「解析開始」へ');
    renderTable();
    draw();
  }

  function cancelDrawMode() {
    App.drawMode = false;
    App.placePhase = 0;
    $('btnLine').classList.remove('active');
    $('btnCancel').style.display = 'none';
    setBanner('');
    setStatus('ライン配置をキャンセルしました');
    draw();
  }

  // --- detection ---
  function sampleLane(lane) {
    var w = canvas.width, h = canvas.height;
    var a = linePoint(lane.t0), b = linePoint(lane.t1);
    var x0 = a.x * w, y0 = a.y * h, x1 = b.x * w, y1 = b.y * h;
    var dx = x1 - x0, dy = y1 - y0;
    var len = Math.sqrt(dx * dx + dy * dy) || 1;
    var ux = dx / len, uy = dy / len;
    var nx = -uy, ny = ux;
    var steps = Math.max(10, Math.floor(len / 3));
    var offs = [-4, -2, 0, 2, 4];
    var sum = 0, count = 0;
    for (var s = 0; s <= steps; s++) {
      var t = s / steps;
      var cx = x0 + dx * t;
      var cy = y0 + dy * t;
      for (var k = 0; k < offs.length; k++) {
        var px = Math.round(cx + nx * offs[k]);
        var py = Math.round(cy + ny * offs[k]);
        if (px < 0 || py < 0 || px >= w || py >= h) continue;
        var d = ctx.getImageData(px, py, 1, 1).data;
        sum += 0.299 * d[0] + 0.587 * d[1] + 0.114 * d[2];
        count++;
      }
    }
    return count ? sum / count : 0;
  }

  function renderTable() {
    var need = lapCount() + 1;
    var n = App.lanes.length;
    if (!n) {
      tbody.innerHTML = '<tr><td colspan="4" style="color:#9ca3af;">未解析</td></tr>';
      return;
    }
    var html = '';
    for (var i = 0; i < n; i++) {
      var no = n - i;
      var hits = App.hits[i] || [];
      var color = COLORS[i % COLORS.length];
      var time = '—', state = '待ち', cls = 'wait';
      if (hits.length >= need) {
        time = (hits[need - 1] - hits[0]).toFixed(3) + ' 秒';
        state = '完了';
        cls = 'ok';
      } else if (hits.length) {
        time = '計測中';
        state = hits.length + ' / ' + need;
      }
      html += '<tr>' +
        '<td><span class="dot" style="background:' + color + '"></span>レーン ' + no + '</td>' +
        '<td>' + hits.length + '</td>' +
        '<td class="' + cls + '">' + time + '</td>' +
        '<td class="' + cls + '">' + state + '</td></tr>';
    }
    tbody.innerHTML = html;
  }

  function waitSeek() {
    return new Promise(function (resolve) {
      var done = false;
      function fin() {
        if (done) return;
        done = true;
        video.removeEventListener('seeked', fin);
        resolve();
      }
      video.addEventListener('seeked', fin);
      setTimeout(fin, 90);
    });
  }
  function tick() {
    return new Promise(function (r) { requestAnimationFrame(function () { r(); }); });
  }

  async function analyze() {
    if (!App.ready || App.analyzing) return;
    App.analyzing = true;
    App.hits = App.lanes.map(function () { return []; });
    $('btnRun').disabled = true;
    video.pause();

    var duration = video.duration || 0;
    var step = 1 / 30;
    var need = lapCount() + 1;
    var S = sens();
    var G = gapSec();
    var base = App.lanes.map(function () { return null; });
    var last = App.lanes.map(function () { return -999; });

    setStatus('解析中… <em>0%</em>');
    video.currentTime = 0;
    await waitSeek();
    draw();
    App.lanes.forEach(function (ln, i) { base[i] = sampleLane(ln); });

    for (var t = step; t < duration; t += step) {
      video.currentTime = t;
      await waitSeek();
      draw();

      App.lanes.forEach(function (ln, i) {
        if (App.hits[i].length >= need) return;
        var sig = sampleLane(ln);
        if (base[i] == null) { base[i] = sig; return; }
        var diff = Math.abs(sig - base[i]);
        if (diff < S * 0.35) {
          base[i] = base[i] * 0.9 + sig * 0.1;
          return;
        }
        if (diff >= S && (t - last[i]) >= G) {
          App.hits[i].push(+t.toFixed(3));
          last[i] = t;
          base[i] = sig;
        }
      });

      if (Math.floor(t * 10) % 5 === 0) {
        setStatus('解析中… <em>' + Math.min(99, Math.round(t / duration * 100)) + '%</em>');
        renderTable();
        await tick();
      }
    }

    renderTable();
    setStatus('解析完了（必要通過 ' + need + ' 回＝周回' + lapCount() + '）');
    App.analyzing = false;
    $('btnRun').disabled = false;
    video.currentTime = 0;
    await waitSeek();
    draw();
  }

  // --- events ---
  canvas.addEventListener('mousedown', onPointerDown);
  window.addEventListener('mousemove', onPointerMove);
  window.addEventListener('mouseup', onPointerUp);
  canvas.addEventListener('touchstart', onPointerDown, { passive: false });
  window.addEventListener('touchmove', onPointerMove, { passive: false });
  window.addEventListener('touchend', onPointerUp);

  $('file').addEventListener('change', function (e) {
    var f = e.target.files && e.target.files[0];
    if (!f) return;
    video.src = URL.createObjectURL(f);
    video.onloadedmetadata = function () {
      App.ready = true;
      App.line = { x1: 0.18, y1: 0.60, x2: 0.82, y2: 0.50 };
      resetLanes();
      fitCanvas();
      video.currentTime = 0;
      setTimeout(function () { draw(); }, 40);
      setStatus('動画準備完了。写真のように「赤ラインを引き直す」で始点→終点を置いてください');
      renderTable();
    };
  });

  $('laneN').addEventListener('change', function () {
    resetLanes();
    if (App.ready) draw();
    renderTable();
  });

  $('btnLine').addEventListener('click', startDrawMode);
  $('btnCancel').addEventListener('click', cancelDrawMode);
  $('btnPlay').addEventListener('click', function () {
    if (!App.ready) return;
    if (video.paused) {
      video.play();
      (function loop() {
        if (video.paused || video.ended) { draw(); return; }
        draw();
        requestAnimationFrame(loop);
      })();
    } else video.pause();
  });
  $('btnClear').addEventListener('click', function () {
    App.hits = App.lanes.map(function () { return []; });
    renderTable();
    draw();
    setStatus('検知をリセットしました');
  });
  $('btnRun').addEventListener('click', function () {
    analyze().catch(function (err) {
      console.error(err);
      App.analyzing = false;
      $('btnRun').disabled = false;
      setStatus('解析エラー: ' + (err && err.message ? err.message : err));
    });
  });

  window.addEventListener('resize', function () {
    if (!App.ready) return;
    fitCanvas();
    draw();
  });

  resetLanes();
  renderTable();
})();
</script>
</body>
</html>
