<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>動画レーンタイム計測（半自動）</title>
<meta name="description" content="動画を見ながらレーンボタンで通過を記録し、レーン別タイムを出す簡易ツール" />
<style>
:root {
  --bg: #0b0c0f; --panel: #16181d; --border: rgba(255,255,255,0.08);
  --text: #f3f4f6; --muted: #9ca3af; --blue: #6BAFD6; --green: #34c759;
  --orange: #ff9f0a; --pink: #e891b0;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; min-height: 100%; background: var(--bg); color: var(--text);
  font-family: "游ゴシック", "Yu Gothic", "Hiragino Sans", "Meiryo", sans-serif;
}
.app { max-width: 720px; margin: 0 auto; padding: 12px 12px 36px; }
h1 {
  margin: 0 0 10px; text-align: center; font-size: 12px; letter-spacing: 0.2em;
  color: #9aa3b2; font-weight: 650;
}
.card {
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 12px; padding: 12px; margin-bottom: 10px;
}
.card h2 {
  margin: 0 0 8px; font-size: 12px; color: var(--muted);
  letter-spacing: 0.06em; font-weight: 700;
}
.row {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap: 8px; align-items: end;
}
label { display: flex; flex-direction: column; gap: 4px; font-size: 11px; color: var(--muted); }
input[type="file"], input[type="number"] {
  width: 100%; border: 1px solid #2a2d34; background: #0b0c0f; color: var(--text);
  border-radius: 8px; padding: 9px 10px; font-size: 14px;
}
.hint { margin: 8px 0 0; font-size: 11px; line-height: 1.55; color: var(--muted); }
.stage {
  background: #000; border-radius: 10px; overflow: hidden;
}
video {
  display: block; width: 100%; height: auto; max-height: 52vh; background: #000;
}
.controls {
  display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; align-items: center;
}
button {
  border: 0; border-radius: 8px; padding: 12px 14px; font-weight: 700; font-size: 13px;
  cursor: pointer; color: #111;
}
.b-blue { background: var(--blue); }
.b-gray { background: #3a3a3c; color: #fff; }
.b-green { background: var(--green); }
.b-pink { background: var(--pink); color: #1c1c1e; }
button:disabled { opacity: 0.4; cursor: default; }
.time-readout {
  margin-left: auto; font-variant-numeric: tabular-nums;
  font-size: 18px; font-weight: 700; color: #fff;
}
.lane-grid {
  display: grid; gap: 8px;
  grid-template-columns: repeat(auto-fit, minmax(96px, 1fr));
  margin-top: 4px;
}
.lane-btn {
  min-height: 64px; border-radius: 10px; border: 0; color: #111;
  font-size: 16px; font-weight: 800; cursor: pointer;
  box-shadow: 0 4px 14px rgba(0,0,0,0.25);
}
.lane-btn:active { transform: scale(0.97); }
.lane-btn small {
  display: block; font-size: 11px; font-weight: 600; opacity: 0.85; margin-top: 2px;
}
.status { margin-top: 8px; font-size: 12px; color: var(--muted); min-height: 1.3em; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td {
  text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border);
  font-variant-numeric: tabular-nums;
}
th { font-size: 11px; color: var(--muted); font-weight: 600; }
.ok { color: var(--green); font-weight: 700; }
.wait { color: var(--orange); }
.dot {
  display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px;
}
.log {
  max-height: 140px; overflow: auto; font-size: 12px; color: var(--muted);
  font-variant-numeric: tabular-nums; line-height: 1.5;
}
</style>
</head>
<body>
<div class="app">
  <h1>VIDEO LANE TIMER · MANUAL</h1>

  <div class="card">
    <h2>1. 準備</h2>
    <div class="row">
      <label style="grid-column:1/-1;">動画
        <input type="file" id="file" accept="video/*" />
      </label>
      <label>レーン数
        <input type="number" id="laneN" min="1" max="8" value="3" />
      </label>
      <label>周回数
        <input type="number" id="laps" min="1" max="50" value="3" />
      </label>
    </div>
    <p class="hint">
      動画を再生しながら、車が計測位置を通過した瞬間に<strong>そのレーンのボタン</strong>を押します。
      各レーンとも「1回目＝スタート、（周回+1）回目＝ゴール」です。右からレーン1です。
    </p>
  </div>

  <div class="card">
    <h2>2. 動画</h2>
    <div class="stage">
      <video id="video" playsinline controls></video>
    </div>
    <div class="controls">
      <button type="button" class="b-blue" id="btnPlay">再生 / 停止</button>
      <button type="button" class="b-gray" id="btnBack05">-0.5秒</button>
      <button type="button" class="b-gray" id="btnFwd05">+0.5秒</button>
      <button type="button" class="b-gray" id="btnClear">記録リセット</button>
      <div class="time-readout" id="clock">0.000</div>
    </div>
    <div class="status" id="status">動画を選んでください</div>
  </div>

  <div class="card">
    <h2>3. 通過ボタン（押した時刻を記録）</h2>
    <div class="lane-grid" id="laneGrid"></div>
  </div>

  <div class="card">
    <h2>4. 各レーンのタイム一覧</h2>
    <table>
      <thead>
        <tr><th>レーン</th><th>通過回数</th><th>タイム</th><th>状態</th></tr>
      </thead>
      <tbody id="tbody">
        <tr><td colspan="4" style="color:#9ca3af;">未記録</td></tr>
      </tbody>
    </table>
  </div>

  <div class="card">
    <h2>5. 通過ログ</h2>
    <div class="log" id="log">まだありません</div>
  </div>
</div>

<script>
(function () {
  'use strict';

  var COLORS = ['#6BAFD6', '#e891b0', '#ff9f0a', '#34c759', '#af52de', '#ff3b30', '#64d2ff', '#ffd60a'];

  var video = document.getElementById('video');
  var clock = document.getElementById('clock');
  var statusEl = document.getElementById('status');
  var laneGrid = document.getElementById('laneGrid');
  var tbody = document.getElementById('tbody');
  var logEl = document.getElementById('log');

  var hits = []; // hits[i] = array of times for lane index i (left→right)
  var logs = [];
  var ready = false;
  var raf = 0;

  function $(id) { return document.getElementById(id); }
  function laneCount() {
    return Math.max(1, Math.min(8, parseInt($('laneN').value, 10) || 3));
  }
  function lapCount() {
    return Math.max(1, Math.min(50, parseInt($('laps').value, 10) || 3));
  }
  function needHits() { return lapCount() + 1; }
  function setStatus(t) { statusEl.textContent = t; }

  function laneNoFromIndex(i) {
    // rightmost visual button = lane 1
    return laneCount() - i;
  }

  function rebuildButtons() {
    var n = laneCount();
    hits = [];
    for (var i = 0; i < n; i++) hits.push([]);
    logs = [];
    laneGrid.innerHTML = '';

    // render left→right, label as right=1
    for (var i = 0; i < n; i++) {
      var no = laneNoFromIndex(i);
      var color = COLORS[i % COLORS.length];
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'lane-btn';
      btn.style.background = color;
      btn.dataset.index = String(i);
      btn.innerHTML = 'レーン ' + no + '<small>通過</small>';
      btn.addEventListener('click', onLaneTap);
      laneGrid.appendChild(btn);
    }
    renderTable();
    renderLog();
  }

  function onLaneTap(e) {
    if (!ready) {
      setStatus('先に動画を選んでください');
      return;
    }
    var i = parseInt(e.currentTarget.dataset.index, 10);
    var t = video.currentTime || 0;
    var need = needHits();
    if (hits[i].length >= need) {
      setStatus('レーン ' + laneNoFromIndex(i) + ' はすでに完了しています');
      return;
    }
    hits[i].push(Number(t.toFixed(3)));
    logs.unshift({
      lane: laneNoFromIndex(i),
      time: Number(t.toFixed(3)),
      n: hits[i].length
    });
    renderTable();
    renderLog();
    var left = need - hits[i].length;
    if (left <= 0) {
      var sec = (hits[i][need - 1] - hits[i][0]).toFixed(3);
      setStatus('レーン ' + laneNoFromIndex(i) + ' 完了：' + sec + ' 秒');
    } else {
      setStatus('レーン ' + laneNoFromIndex(i) + ' 通過 ' + hits[i].length + ' / ' + need + '（' + t.toFixed(3) + 's）');
    }
  }

  function renderTable() {
    var n = laneCount();
    var need = needHits();
    if (!n) {
      tbody.innerHTML = '<tr><td colspan="4" style="color:#9ca3af;">未記録</td></tr>';
      return;
    }
    var html = '';
    for (var i = 0; i < n; i++) {
      var no = laneNoFromIndex(i);
      var arr = hits[i] || [];
      var color = COLORS[i % COLORS.length];
      var time = '—', st = '待ち', cls = 'wait';
      if (arr.length >= need) {
        time = (arr[need - 1] - arr[0]).toFixed(3) + ' 秒';
        st = '完了';
        cls = 'ok';
      } else if (arr.length) {
        time = '計測中';
        st = arr.length + ' / ' + need;
      }
      html += '<tr>' +
        '<td><span class="dot" style="background:' + color + '"></span>レーン ' + no + '</td>' +
        '<td>' + arr.length + '</td>' +
        '<td class="' + cls + '">' + time + '</td>' +
        '<td class="' + cls + '">' + st + '</td></tr>';
    }
    tbody.innerHTML = html;
  }

  function renderLog() {
    if (!logs.length) {
      logEl.textContent = 'まだありません';
      return;
    }
    logEl.innerHTML = logs.slice(0, 40).map(function (x) {
      return 'L' + x.lane + '  #' + x.n + '  @ ' + x.time.toFixed(3) + 's';
    }).join('<br>');
  }

  function updateClock() {
    clock.textContent = (video.currentTime || 0).toFixed(3);
    if (!video.paused && !video.ended) {
      raf = requestAnimationFrame(updateClock);
    }
  }

  $('file').addEventListener('change', function (e) {
    var f = e.target.files && e.target.files[0];
    if (!f) return;
    video.src = URL.createObjectURL(f);
    video.onloadedmetadata = function () {
      ready = true;
      rebuildButtons();
      setStatus('準備完了。再生しながら通過ボタンを押してください（' + video.duration.toFixed(1) + '秒）');
      clock.textContent = '0.000';
    };
  });

  $('laneN').addEventListener('change', function () {
    rebuildButtons();
    setStatus('レーン数を更新しました');
  });
  $('laps').addEventListener('change', function () {
    renderTable();
    setStatus('周回数を更新（必要通過 ' + needHits() + ' 回）');
  });

  $('btnPlay').addEventListener('click', function () {
    if (!ready) return;
    if (video.paused) {
      video.play();
      cancelAnimationFrame(raf);
      updateClock();
    } else {
      video.pause();
      cancelAnimationFrame(raf);
      updateClock();
    }
  });
  video.addEventListener('play', function () {
    cancelAnimationFrame(raf);
    updateClock();
  });
  video.addEventListener('pause', function () {
    cancelAnimationFrame(raf);
    updateClock();
  });
  video.addEventListener('timeupdate', function () {
    if (video.paused) clock.textContent = (video.currentTime || 0).toFixed(3);
  });

  $('btnBack05').addEventListener('click', function () {
    if (!ready) return;
    video.currentTime = Math.max(0, (video.currentTime || 0) - 0.5);
    clock.textContent = video.currentTime.toFixed(3);
  });
  $('btnFwd05').addEventListener('click', function () {
    if (!ready) return;
    video.currentTime = Math.min(video.duration || 0, (video.currentTime || 0) + 0.5);
    clock.textContent = video.currentTime.toFixed(3);
  });
  $('btnClear').addEventListener('click', function () {
    hits = hits.map(function () { return []; });
    logs = [];
    renderTable();
    renderLog();
    setStatus('記録をリセットしました');
  });

  rebuildButtons();
})();
</script>
</body>
</html>
